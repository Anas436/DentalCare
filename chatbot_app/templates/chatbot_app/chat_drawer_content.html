<div class="flex-1 overflow-y-auto p-4 space-y-3" id="drawer-messages">
    <div class="flex items-start gap-2">
        <div class="h-8 w-8 rounded-full bg-gradient-to-br from-teal-500 to-teal-600 flex items-center justify-center flex-shrink-0 shadow-md">
            <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 3.104v5.714a2.25 2.25 0 01-.659 1.591L5 14.5M9.75 3.104c-.251.023-.501.05-.75.082m.75-.082a24.301 24.301 0 014.5 0m0 0v5.714a2.25 2.25 0 00.659 1.591L19 14.5M14.25 3.104c.251.023.501.05.75.082M19 14.5l-1.5-1.5M5 14.5l1.5-1.5"></path>
            </svg>
        </div>
        <div class="bg-white rounded-2xl rounded-tl-md px-4 py-3 shadow-sm border border-gray-100 max-w-[85%]">
            <p class="text-gray-800 text-sm">Hello! How can I help you?</p>
        </div>
    </div>
</div>

<div class="border-t bg-white p-3">
    <form id="drawer-chat-form" class="flex gap-2">
        <input type="text"
               id="drawer-message-input"
               placeholder="Type a message..."
               class="flex-1 px-3 py-2 text-sm border-2 border-gray-200 rounded-xl focus:ring-2 focus:ring-teal-500 focus:border-teal-500 outline-none transition">
        <button type="submit"
                id="drawer-send-btn"
                class="px-4 py-2 bg-gradient-to-r from-teal-600 to-teal-700 text-white rounded-xl hover:from-teal-700 hover:to-teal-800 transition-all text-sm font-medium disabled:opacity-50">
            Send
        </button>
    </form>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    var drawerMessages = document.getElementById('drawer-messages');
    var drawerForm = document.getElementById('drawer-chat-form');
    if (!drawerForm) return;

    var drawerInput = document.getElementById('drawer-message-input');
    var drawerSendBtn = document.getElementById('drawer-send-btn');

    function addDrawerMessage(content, isUser) {
        var wrapper = document.createElement('div');
        wrapper.className = 'flex items-start gap-2 ' + (isUser ? 'flex-row-reverse' : '');

        var bubble = document.createElement('div');
        bubble.className = (isUser ? 'bg-gradient-to-br from-teal-500 to-teal-600 text-white rounded-2xl rounded-tr-md' : 'bg-white rounded-2xl rounded-tl-md') +
            ' px-4 py-3 shadow-sm border border-gray-100 max-w-[85%]';
        bubble.innerHTML = '<p class="text-sm whitespace-pre-wrap">' + content.replace(/\n/g, '<br>') + '</p>';

        wrapper.appendChild(bubble);
        drawerMessages.appendChild(wrapper);
        drawerMessages.scrollTop = drawerMessages.scrollHeight;
    }

    drawerForm.addEventListener('submit', async function(e) {
        e.preventDefault();
        var message = drawerInput.value.trim();
        if (!message) return;

        addDrawerMessage(message, true);
        drawerInput.value = '';
        drawerSendBtn.disabled = true;

        try {
            var csrfToken = document.querySelector('[name=csrfmiddlewaretoken]').value;
            var response = await fetch('/chat/api/message/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': csrfToken,
                },
                body: JSON.stringify({ message: message }),
            });

            var data = await response.json();
            drawerSendBtn.disabled = false;

            if (data.status === 'success') {
                addDrawerMessage(data.response, false);
            } else {
                addDrawerMessage('Sorry, an error occurred.', false);
            }
        } catch (error) {
            drawerSendBtn.disabled = false;
            addDrawerMessage('Sorry, something went wrong.', false);
        }

        drawerInput.focus();
    });
});
</script>
