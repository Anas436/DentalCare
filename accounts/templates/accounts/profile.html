{% extends 'base.html' %}
{% block title %}Profile - Dental Appointment System{% endblock %}
{% block content %}
<div class="max-w-2xl mx-auto bg-white p-8 rounded-xl shadow-lg">
    <h2 class="text-3xl font-bold text-gray-800 mb-6">Edit Profile</h2>
    <form method="POST" action="{% url 'profile' %}">
        {% csrf_token %}
        <div class="mb-4">
            <label for="id_phone" class="block text-gray-700 font-medium mb-2">Phone</label>
            {{ form.phone }}
        </div>
        <div class="mb-4">
            <label for="id_date_of_birth" class="block text-gray-700 font-medium mb-2">Date of Birth</label>
            {{ form.date_of_birth }}
        </div>
        <div class="mb-4">
            <label for="id_address" class="block text-gray-700 font-medium mb-2">Address</label>
            {{ form.address }}
        </div>
        <div class="mb-6">
            <label for="id_emergency_contact" class="block text-gray-700 font-medium mb-2">Emergency Contact</label>
            {{ form.emergency_contact }}
        </div>
        <button type="submit"
                class="w-full bg-teal-600 text-white py-3 rounded-lg hover:bg-teal-700 transition font-semibold">
            Update Profile
        </button>
    </form>
</div>
{% endblock %}
