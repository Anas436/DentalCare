{% if success %}
<tr>
    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">
        {{ appointment.date_slot|date:"M d, Y \a\t g:i A" }}
    </td>
    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">
        Dr. {{ appointment.doctor.name }}
    </td>
    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
        {{ appointment.doctor.specialization|specialization_display }}
    </td>
    <td class="px-6 py-4 whitespace-nowrap">
        <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-blue-100 text-blue-800">
            Booked (Rescheduled)
        </span>
    </td>
    <td class="px-6 py-4 whitespace-nowrap text-sm font-medium">
        <span class="text-green-600">Rescheduled successfully</span>
    </td>
</tr>
{% elif error %}
<tr class="bg-red-50">
    <td colspan="5" class="px-6 py-4 text-red-600">{{ error }}</td>
</tr>
{% endif %}
