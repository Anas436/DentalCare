{% if success %}
<tr class="bg-gray-100">
    <td colspan="5" class="px-6 py-4">
        <div class="text-gray-600">Appointment cancelled successfully.</div>
    </td>
</tr>
{% elif error %}
<tr class="bg-red-50">
    <td colspan="5" class="px-6 py-4 text-red-600">{{ error }}</td>
</tr>
{% endif %}
