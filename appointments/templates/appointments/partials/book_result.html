{% if success %}
<div class="bg-green-100 border border-green-400 text-green-800 px-4 py-3 rounded">
    <p class="font-semibold">Success!</p>
    <p>Phone: {{ appointment.patient.patient_profile.phone }}</p>
    <p>Appointment booked successfully for {{ appointment.date_slot|date:"M d, Y \a\t g:i A" }} with Dr. {{ appointment.doctor.name }}.</p>
</div>
{% elif error %}
<div class="bg-red-100 border border-red-400 text-red-800 px-4 py-3 rounded">
    <p class="font-semibold">Error</p>
    <p>{{ error }}</p>
</div>
{% endif %}
